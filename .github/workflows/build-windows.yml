name: Build Windows

# PyInstaller no compila cruzado y los contenedores Windows necesitan un host
# Windows, así que este runner es el sustituto de "compilar desde el Mac".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar la release

jobs:
  build:
    runs-on: windows-latest

    # El env va a NIVEL DE JOB a propósito.
    # El contexto `secrets` no está permitido dentro de un `if:` de paso —
    # GitHub rechaza el workflow entero y el run muere sin arrancar jobs.
    # El env de job sí es visible en `if:`, así que se compara contra env.PFX.
    env:
      PFX: ${{ secrets.SIGNING_PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
      # La consola del runner usa cp1252: sin esto, imprimir cualquier carácter
      # fuera de ese juego revienta con UnicodeEncodeError.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11: wheels estables de ctranslate2 y sentencepiece en Windows.
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # La clave incluye el hash del script: si cambian las versiones fijadas
      # en PINNED, la caché se invalida sola.
      - name: Caché de modelos
        uses: actions/cache@v4
        with:
          path: models
          key: argos-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Descargar modelos Argos
        run: python scripts/fetch_models.py

      - name: Comprobar que la traducción funciona
        shell: bash
        run: |
          python -c "
          from app.translator import translate
          a = translate('hola, tengo una reunión mañana', 'es', 'en')
          b = translate('the server is not responding', 'en', 'es')
          print('ES->EN:', a)
          print('EN->ES:', b)
          assert a.strip() and b.strip(), 'traducción vacía'
          "

      - name: Compilar
        run: pyinstaller build/traslatetool.spec --noconfirm

      # --- Firma autofirmada -------------------------------------------------
      # Secreto SIGNING_PFX_BASE64: el .pfx en base64.
      # Secreto SIGNING_PFX_PASSWORD: su contraseña.
      # Si no están definidos, el paso se salta y el build sigue sin firmar.
      # continue-on-error: un fallo de firma NO debe impedir que salga el .exe.
      # Sin esto, el instalador y la subida del artefacto se saltan y el build
      # entero se queda sin entregable.
      - name: Firmar
        if: ${{ env.PFX != '' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx",
            [Convert]::FromBase64String($env:PFX))
          Write-Host "pfx: $((Get-Item $env:RUNNER_TEMP\cert.pfx).Length) bytes"

          # Buscar signtool en las dos ubicaciones posibles del SDK.
          $roots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "${env:ProgramFiles}\Windows Kits\10\bin"
          ) | Where-Object { Test-Path $_ }
          Write-Host "raices SDK encontradas: $($roots.Count)"

          $signtool = $roots |
            ForEach-Object { Get-ChildItem $_ -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue } |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) { Write-Host "::error::signtool.exe no encontrado"; exit 1 }
          Write-Host "signtool: $signtool"

          # -Filter en vez de -Include: -Include se comporta de forma distinta
          # segun como venga el path y puede devolver vacio.
          $targets = @(Get-ChildItem dist\traslatetool -Recurse -Filter *.exe |
                       Select-Object -ExpandProperty FullName)
          Write-Host "exes a firmar: $($targets.Count)"
          $targets | ForEach-Object { Write-Host "  $_" }
          if ($targets.Count -eq 0) { Write-Host "::error::no hay .exe que firmar"; exit 1 }

          # El servidor de sellado de tiempo falla a veces; se reintenta.
          $servers = @(
            'http://timestamp.digicert.com',
            'http://timestamp.sectigo.com',
            'http://time.certum.pl'
          )
          $signed = $false
          foreach ($ts in $servers) {
            Write-Host "--- firmando con sellado $ts"
            & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:PFX_PASSWORD" `
              /fd SHA256 /td SHA256 /tr $ts @targets
            if ($LASTEXITCODE -eq 0) { $signed = $true; break }
            Write-Host "  fallo (exit $LASTEXITCODE), probando siguiente"
          }

          if (-not $signed) {
            Write-Host "--- ultimo intento: sin sellado de tiempo"
            & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:PFX_PASSWORD" `
              /fd SHA256 @targets
            $signed = ($LASTEXITCODE -eq 0)
          }

          Remove-Item "$env:RUNNER_TEMP\cert.pfx" -Force
          if ($signed) {
            & $signtool verify /pa dist\traslatetool\traslatetool.exe
            Write-Host "FIRMA OK"
          } else {
            Write-Host "::warning::no se pudo firmar; el .exe sale sin firma"
          }

      - name: Instalador Inno Setup
        if: always()
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Firmar el instalador
        if: ${{ always() && env.PFX != '' }}
        continue-on-error: true
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx",
            [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign `
            /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:PFX_PASSWORD" `
            /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            dist\traslatetool-setup.exe
          Remove-Item "$env:RUNNER_TEMP\cert.pfx" -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traslatetool-windows
          path: |
            dist/traslatetool-setup.exe
            dist/traslatetool/**
            signing/cert.cer
          retention-days: 30

      # Los artefactos de Actions necesitan token hasta para un repo publico.
      # Una release, no: sus assets se descargan con un curl sin autenticar.
      # URL fija: .../releases/latest/download/traslatetool-setup.exe
      - name: Publicar release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "traslatetool (build ${{ github.run_number }})" \
            --notes "Instalador firmado. Importa cert.cer antes de instalar." \
            dist/traslatetool-setup.exe \
            signing/cert.cer
